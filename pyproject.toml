[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rote"
version = "0.1.0"
description = "Computer-use automation: an LLM discovers a task once, deterministic replay runs it every time after."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "httpx>=0.27",
  "pillow>=10.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
rote = "rote.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rote*", "fakebank*"]

[tool.setuptools.package-data]
rote = ["surface/*.js", "handoff/templates/*.html"]
fakebank = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Chromium and a running FakeBank"]
