<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>FAKEBANK CORE</title>
<style>
/* Looks tidier, but the markup stays legacy on purpose: frames, layout tables, unlabelled inputs, no test IDs. */
body { font-family: Consolas, "Lucida Console", "Courier New", monospace; font-size: 13px; color: #1b2631; background: #e9eef2; margin: 0; padding: 10px 16px; }
td { font-size: 13px; padding: 3px 6px; }
.err { color: #b00020; font-weight: bold; }
h2 { font-size: 14px; letter-spacing: 1px; margin: 0 0 14px 0; padding: 7px 10px; color: #ffffff; background: linear-gradient(#24588a, #173d63); border-bottom: 3px solid #e8b100; }
a { color: #0b4f8a; text-decoration: none; }
a:hover { text-decoration: underline; background: #fff4c7; }
table[border="1"] { border-collapse: collapse; background: #ffffff; border: 1px solid #8d9ba8; }
table[border="1"] td { border: 1px solid #c3ccd5; padding: 5px 9px; }
table[border="1"] tr:first-child td { background: #dbe4ec; }
table[border="1"] tr:nth-child(even) td { background: #f4f7f9; }
caption { padding: 6px 0; color: #173d63; }
input { font-family: Consolas, "Lucida Console", "Courier New", monospace; font-size: 13px; }
input[type="text"], input[type="password"] { padding: 4px 6px; border: 1px solid #7f8d9a; background: #fffdf3; }
input[type="button"], input[type="submit"] { padding: 4px 12px; border: 1px solid #173d63; border-radius: 2px; color: #102a43; background: linear-gradient(#ffffff, #d5dfe8); cursor: pointer; }
input[type="button"]:hover, input[type="submit"]:hover { background: #fff4c7; }
</style>
</head>
<body>
{% block content %}{% endblock %}
{% include "_overlays.html" %}
</body>
</html>
