{% if "notice" in overlays %}
<div style="position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.35); z-index:100">
<table style="margin:60px auto; background:#fff8d6; border:2px solid #8a6d00; box-shadow:0 6px 18px rgba(0,0,0,0.35)" cellpadding="10">
<tr><td><b>SYSTEM NOTICE: MAINTENANCE 22:00 ET</b></td></tr>
<tr><td align="center"><input type="button" value="OK" onclick="this.closest('div').remove()"></td></tr>
</table>
</div>
{% endif %}
{% if "supervisor_override" in overlays %}
<div style="position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:101">
<table style="margin:60px auto; background:#ffe9e9; border:2px solid #9b1c1c; box-shadow:0 6px 18px rgba(0,0,0,0.35)" cellpadding="8">
<tr><td colspan="2"><b>SUPERVISOR OVERRIDE REQUIRED</b></td></tr>
<tr><td><b>SUPERVISOR PASSWORD</b></td><td><input type="password" name="F0901" size="12"></td></tr>
<tr><td colspan="2" align="center">
<input type="button" value="OK" onclick="var box=this.closest('div'); if (box.querySelector('input[type=password]').value) { box.remove(); } else { alert('PASSWORD REQUIRED'); }">
<input type="button" value="CANCEL" onclick="location.href='/cgi/MBRINQ'">
</td></tr>
</table>
</div>
{% endif %}
{% if "unknown_popup" in overlays %}
<div style="position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.35); z-index:102">
<table style="margin:60px auto; background:#e8ecff; border:2px solid #2f3f8f; box-shadow:0 6px 18px rgba(0,0,0,0.35)" cellpadding="10">
<tr><td><b>ACCOUNT VERIFICATION PENDING - CALL EXT 4410</b></td></tr>
<tr><td align="center"><input type="button" value="CONTINUE" onclick="this.closest('div').remove()"></td></tr>
</table>
</div>
{% endif %}
